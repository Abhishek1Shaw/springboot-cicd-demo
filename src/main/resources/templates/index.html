<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jenkins-Test UI</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <div class="container">
        <h1>Jenkins-Test Project</h1>
        <p th:text="${message}">[message]</p>
        <button id="apiBtn">Call API</button>
        <div id="apiResult"></div>
    </div>

    <script>
        document.getElementById('apiBtn').addEventListener('click', function() {
            fetch('/api/hello')
                .then(resp => resp.json())
                .then(data => {
                    document.getElementById('apiResult').textContent = data.message;
                })
                .catch(err => {
                    document.getElementById('apiResult').textContent = 'Error: ' + err;
                });
        });
    </script>
</body>
</html>
